[build]
  command = "go build -o ssg && ./ssg"
  publish = "public"

[build.environment]
  GO_VERSION = "1.25"

[[redirects]]
  from = "/feed.xml"
  to = "/blog/index.xml"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
